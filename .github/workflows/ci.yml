# TR-OS CI Pipeline (Phase 10)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  TR_OS_ENVIRONMENT: testing
  TR_OS_AUTH_MODE: dev
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
  TR_OS_AUTH_SECRET: ${{ secrets.TR_OS_AUTH_SECRET }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Python lint
        run: ruff check tros/
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-mock
      - name: Run backend tests
        run: python -m pytest tests/ -q --tb=short

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test

  build-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npx vite build

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for hardcoded secrets
        run: |
          echo "Scanning for potential secrets..."
          if grep -rn "sk-[a-zA-Z0-9]\{20,\}" tros/ --include="*.py" | grep -v "test_" | grep -v "# " | grep -v "__pycache__"; then
            echo "::error::Potential API key found in source"
            exit 1
          fi
          echo "No hardcoded secrets found."

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test-backend, test-frontend, build-frontend, security-scan]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t tros-api:test .
      - name: Verify image
        run: docker image inspect tros-api:test | head -5
