# TR-OS Deploy Pipeline (Phase 10)
name: Deploy

on:
  push:
    branches: [main]

env:
  TR_OS_BUILD_VERSION: ${{ github.sha }}
  TR_OS_COMMIT_SHA: ${{ github.sha }}

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --build-arg BUILD_VERSION=${{ github.sha }} \
            --build-arg COMMIT_SHA=${{ github.sha }} \
            -t tros-api:${{ github.sha }} \
            -t tros-api:latest \
            .

