# Nginx reverse proxy for TR-OS production deployment (Phase 10)
# Serves static frontend + proxies API to FastAPI backend

upstream tros-api {
    server tros-api:8000;
}

# Connection rate limiting (Phase 10)
limit_conn_zone $binary_remote_addr zone=addr:10m;

server {
    listen 80;
    server_name _;

    # --- Security headers ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'self';" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --- Gzip compression ---
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/event-stream;
    gzip_min_length 256;
    gzip_vary on;

    # --- Request size limit ---
    client_max_body_size 1m;

    # --- Connection timeout (increased for SSE) ---
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    keepalive_timeout 65;

    # --- Connection limiting ---
    limit_conn addr 20;

    # --- API proxy (no-cache) ---
    location /api/ {
        proxy_pass http://tros-api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;

        # No cache for API
        add_header Cache-Control "no-store" always;

        # SSE support
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering "no" always;
    }

    # --- SSE endpoint specific ---
    location ~ ^/api/v1/missions/[^/]+/events$ {
        proxy_pass http://tros-api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_set_header Last-Event-ID $http_last_event_id;
        proxy_http_version 1.1;

        # SSE: disable buffering, long timeout
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
        add_header Cache-Control "no-cache" always;
        add_header X-Accel-Buffering "no" always;
    }

    # --- Static files (frontend PWA) ---
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # No cache for index.html
        location = /index.html {
            add_header Cache-Control "no-cache";
        }
    }

    # --- Health endpoint (no auth) ---
    location /api/v1/health {
        proxy_pass http://tros-api;
        access_log off;
    }
}
