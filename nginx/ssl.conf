# SSL/TLS configuration for Let's Encrypt (Phase 10)
# Include this file in your nginx server block for HTTPS
#
# Usage:
#   include /etc/nginx/conf.d/ssl.conf;
#
# Prerequisites:
#   - Run scripts/init-letsencrypt.sh to obtain certificates
#   - Replace yourdomain.com with your actual domain

ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

# TLS protocol versions — TLS 1.2+ only
ssl_protocols TLSv1.2 TLSv1.3;

# Prefer server ciphers
ssl_prefer_server_ciphers on;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

# SSL session caching
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 10m;
ssl_session_tickets off;

# OCSP stapling
ssl_stapling on;
ssl_stapling_verify on;
resolver 8.8.8.8 8.8.4.4 valid=300s;
resolver_timeout 5s;

# DH parameters (generate with: openssl dhparam -out /etc/ssl/certs/dhparam.pem 2048)
# ssl_dhparam /etc/ssl/certs/dhparam.pem;
