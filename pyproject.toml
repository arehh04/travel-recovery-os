[project]
name = "tros"
version = "0.1.0"
description = "TR-OS: Travel Recovery Operating System - Agentic AI travel disruption recovery"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
    "rich>=13.0",
    "openai>=1.30.0",
    "python-dotenv>=1.0",
    "pydantic-settings>=2.0.0",
    "PyYAML>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
tros = "tros.__main__:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.ruff.lint]
ignore = [
    "B008",    # FastAPI Depends()
    "B018",    # Useless expression
    "BLE001",  # Blind exception
    "DTZ",     # Datetime timezone rules
    "PYI",     # Stub file rules
    "SIM102",  # Nested ifs
    "PLW1510", # subprocess run check=False
    "S110",    # pass in except
    "C408",    # dict() call
    "PERF402", # list copy
]
