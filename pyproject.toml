[project]
name = "tros"
version = "0.1.0"
description = "TR-OS: Travel Recovery Operating System - Agentic AI travel disruption recovery"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
    "rich>=13.0",
    "openai>=1.30.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
tros = "tros.__main__:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
