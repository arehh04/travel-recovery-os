</section>

                        </label>
<input class="tr-input font-numeric-data text-numeric-data uppercase" placeholder="City or Airport" type="text" value="KUL"/>
</div>
<div class="hidden md:flex w-10 h-10 items-center justify-center rounded-full bg-surface-container border border-outline-variant/30 text-on-surface-variant mt-6">

<span class="material-symbols-outlined text-[16px]">flight_land</span> Destination
                        </label>
<input class="tr-input font-numeric-data text-numeric-data uppercase" placeholder="City or Airport" type="text" value="NRT"/>
</div>
</div>

<div class="grid grid-cols-1 md:grid-cols-3 gap-6">
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">calendar_today</span> Target Date
                        </label>
<input class="tr-input font-body-md text-body-md font-medium" type="text" value="20 Aug 2026"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">person</span> Travelers

<option>2 Adults</option>
</select>

<div class="flex flex-col gap-2">

<button class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-6 py-1.5 transition-all hover:text-secondary scale-100 duration-200 ease-out shadow-sm">

<span class="material-symbols-outlined mb-0.5 text-[24px]">person</span>
<span class="font-label-sm text-label-sm">Profile</span>
</button>

<script>
        // Simple script to handle input focus styles if CSS focus-within isn't sufficient for complex layouts
        document.querySelectorAll('.tr-input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('text-secondary');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('text-secondary');
            });
        });
    </script>
